name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild, so build-time data like the INSPIRE publication count stays current
  schedule:
    - cron: '17 9 * * 1'
    # Daily morning build (06:15 Pacific standard time, 07:15 in summer), which publishes
    # posts scheduled for that morning or earlier (see getPosts in src/lib/content.ts).
    # GitHub may start a scheduled run late, sometimes by an hour.
    - cron: '15 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
